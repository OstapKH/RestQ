- name: Validate experiment timing configuration
  hosts: localhost
  gather_facts: false
  tags: timing_validation
  tasks:
    - name: Validate experiment duration format
      assert:
        that:
          - experiment_duration is match('^[0-9]+:[0-5][0-9]:[0-5][0-9]$')
        fail_msg: >-
          experiment_duration must use HH:MM:SS format with valid minutes and seconds;
          received {{ experiment_duration }}

    - name: Validate experiment duration is positive
      assert:
        that:
          - (scaphandre_timeout_s | int) > 0
        fail_msg: "experiment_duration must be greater than 00:00:00"
        success_msg: >-
          Scaphandre timeout is {{ scaphandre_timeout_s }} seconds for
          experiment_duration {{ experiment_duration }}

    - name: Generate one controller timestamp for the full run
      set_fact:
        timestamp: "{{ lookup('pipe', 'date +%Y%m%d_%H%M%S') }}"

    - name: Validate source mode
      assert:
        that:
          - source_mode in ['github', 'local_archive']
        fail_msg: "source_mode must be github or local_archive; received {{ source_mode }}"

    - name: Set local archive paths
      set_fact:
        source_archive_path: "/tmp/restq-source-{{ timestamp }}.tar.gz"
        source_archive_remote_path: "/root/restq-source-{{ timestamp }}.tar.gz"
      when: source_mode == 'local_archive'

    - name: Create local RestQ source archive
      command: >-
        tar --exclude=.git --exclude='*/target' --exclude=.m2
        --exclude=.gradle --exclude=node_modules --exclude='.env*'
        --exclude='Results*' --exclude='.DS_Store'
        -czf {{ source_archive_path }} -C {{ playbook_dir }}/../.. .
      when: source_mode == 'local_archive'

    - name: Calculate local RestQ source archive checksum
      command: "sha256sum {{ source_archive_path }}"
      register: source_archive_checksum
      changed_when: false
      when: source_mode == 'local_archive'

    - name: Record local RestQ source archive provenance
      set_fact:
        source_archive_sha256: "{{ source_archive_checksum.stdout.split()[0] }}"
        source_archive_filename: "{{ source_archive_path | basename }}"
      when: source_mode == 'local_archive'

- name: Initialize grid 5000
  hosts: grid5000
  gather_facts: false
  remote_user: "{{ grid_user }}"
  vars:
    OS_image: ubuntu2204-x64-min
    grid_time: "{{ experiment_duration | default('5:00:00') }}"
  tasks:

    - name: Skip Grid5000 initialization for other deployment modes
      ansible.builtin.meta: end_play
      when: deployment_mode != 'grid5000'

    - name: Default Grid5000 cleanup verdict to preserve reservations
      set_fact:
        benchmark_completed_successfully: false

    # Reserve nodes for lille site (specific chifflot nodes + 1 other)
    - name: Go to the frontend of {{ grid_site }} then create a job for chifflot nodes (lille site)
      command: "oarsub -l host=2,walltime={{ grid_time }} -r 'now' -t deploy -p 'host like chifflot-%'"
      register: job_output
      when: grid_site == 'lille'

    - name: Extract job ID for chifflot nodes (lille site)
      set_fact:
        chifflot_job_id: "{{ job_output.stdout | regex_search('OAR_JOB_ID=(\\d+)', '\\1') | first }}"
      when: grid_site == 'lille'

    - name: Log chifflot job ID (lille site)
      debug:
        msg: "Chifflot Job ID: {{ chifflot_job_id }}"
      when: grid_site == 'lille'

    - name: Reserve one additional node (lille site)
      command: "oarsub -l host=1,walltime={{ grid_time }} -r 'now' -t deploy"
      register: other_job_output
      when: grid_site == 'lille'

    - name: Extract job ID for other node (lille site)
      set_fact:
        other_job_id: "{{ other_job_output.stdout | regex_search('OAR_JOB_ID=(\\d+)', '\\1') | first }}"
      when: grid_site == 'lille'

    - name: Log other job ID (lille site)
      debug:
        msg: "Other Job ID: {{ other_job_id }}"
      when: grid_site == 'lille'

    - name: Wait for Lille reservations to start
      command: "oarstat -s -j {{ item.id }}"
      register: lille_job_state
      changed_when: false
      until: >-
        'Running' in lille_job_state.stdout or
        (lille_job_state.stdout | regex_search('toError|Error|Finishing|Terminated|Hold|Suspended')) is not none
      failed_when: >-
        lille_job_state.rc != 0 or
        (lille_job_state.stdout | regex_search('toError|Error|Finishing|Terminated|Hold|Suspended')) is not none
      retries: "{{ grid_job_wait_timeout_minutes | int }}"
      delay: "{{ grid_job_poll_interval_s | int }}"
      loop:
        - id: "{{ chifflot_job_id }}"
          label: chifflot reservation
        - id: "{{ other_job_id }}"
          label: client reservation
      loop_control:
        label: "{{ item.label }} (job {{ item.id }})"
      when: grid_site == 'lille'

    - name: Get chifflot job details (lille site)
      command: "oarstat -f -j {{ chifflot_job_id }}"
      register: chifflot_job_details
      changed_when: false
      when: grid_site == 'lille'

    - name: Extract assigned chifflot hostnames (lille site)
      set_fact:
        chifflot_nodes: "{{ (chifflot_job_details.stdout | regex_search('assigned_hostnames = (.+)', '\\1')) | first | split('+') }}"
      when: grid_site == 'lille'

    - name: Log chifflot nodes (lille site)
      debug:
        msg: "Chifflot nodes: {{ chifflot_nodes }}"
      when: grid_site == 'lille'

    - name: Get other job details (lille site)
      command: "oarstat -f -j {{ other_job_id }}"
      register: other_job_details
      changed_when: false
      when: grid_site == 'lille'

    - name: Extract assigned other hostname (lille site)
      set_fact:
        other_node: "{{ (other_job_details.stdout | regex_search('assigned_hostnames = (.+)', '\\1')) | first }}"
      when: grid_site == 'lille'

    - name: Log other node (lille site)
      debug:
        msg: "Other node: {{ other_node }}"
      when: grid_site == 'lille'

    - name: Assign node names to variables (lille site)
      set_fact:
        node1: "{{ chifflot_nodes[0] }}"
        node2: "{{ chifflot_nodes[1] }}"
        node3: "{{ other_node }}"
        cacheable: true
      when: grid_site == 'lille'

    - name: Log node assignments (lille site)
      debug:
        msg: "Node1 (chifflot): {{ node1 }}, Node2 (chifflot): {{ node2 }}, Node3: {{ node3 }}"
      when: grid_site == 'lille'

    # Reserve nodes for non-lille sites (3 random nodes)
    - name: Reserve 3 random nodes (non-lille sites)
      command: "oarsub -l host=3,walltime={{ grid_time }} -r 'now' -t deploy"
      register: random_job_output
      when: grid_site != 'lille'

    - name: Extract job ID for random nodes (non-lille sites)
      set_fact:
        random_job_id: "{{ random_job_output.stdout | regex_search('OAR_JOB_ID=(\\d+)', '\\1') | first }}"
      when: grid_site != 'lille'

    - name: Log random job ID (non-lille sites)
      debug:
        msg: "Random nodes Job ID: {{ random_job_id }}"
      when: grid_site != 'lille'

    - name: Wait for random-node reservation to start (non-lille sites)
      command: "oarstat -s -j {{ random_job_id }}"
      register: random_job_state
      changed_when: false
      until: >-
        'Running' in random_job_state.stdout or
        (random_job_state.stdout | regex_search('toError|Error|Finishing|Terminated|Hold|Suspended')) is not none
      failed_when: >-
        random_job_state.rc != 0 or
        (random_job_state.stdout | regex_search('toError|Error|Finishing|Terminated|Hold|Suspended')) is not none
      retries: "{{ grid_job_wait_timeout_minutes | int }}"
      delay: "{{ grid_job_poll_interval_s | int }}"
      when: grid_site != 'lille'

    - name: Get random nodes job details (non-lille sites)
      command: "oarstat -f -j {{ random_job_id }}"
      register: random_job_details
      changed_when: false
      when: grid_site != 'lille'

    - name: Extract assigned random hostnames (non-lille sites)
      set_fact:
        random_nodes: "{{ (random_job_details.stdout | regex_search('assigned_hostnames = (.+)', '\\1')) | first | split('+') }}"
      when: grid_site != 'lille'

    - name: Log random nodes (non-lille sites)
      debug:
        msg: "Random nodes: {{ random_nodes }}"
      when: grid_site != 'lille'

    - name: Assign node names to variables (non-lille sites)
      set_fact:
        node1: "{{ random_nodes[0] }}"
        node2: "{{ random_nodes[1] }}"
        node3: "{{ random_nodes[2] }}"
        cacheable: true
      when: grid_site != 'lille'

    - name: Log node assignments (non-lille sites)
      debug:
        msg: "Node1: {{ node1 }}, Node2: {{ node2 }}, Node3: {{ node3 }}"
      when: grid_site != 'lille'

    - name: Add nodes to in-memory inventory
      add_host:
        name: "{{ item }}"
        ansible_host: "{{ lookup('vars', item) }}"
        groups: reserved_nodes
        # Make sure these are correctly passed to hostvars if needed later
        node1_val: "{{ node1 }}"
        node2_val: "{{ node2 }}"
        node3_val: "{{ node3 }}"
      loop:
        - node1
        - node2
        - node3

    - name: Deploy systems on all nodes in parallel
      command: "kadeploy3 -m {{ item }} -e {{ OS_image }}"
      loop:
        - "{{ node1 }}"
        - "{{ node2 }}"
        - "{{ node3 }}"
      async: 1800  # 30 minutes timeout
      poll: 0
      register: deploy_async_results

    - name: Wait for parallel deployments to finish
      async_status:
        jid: "{{ item.ansible_job_id }}"
      register: deploy_async_poll_results
      until: deploy_async_poll_results.finished
      retries: 300  # Retry for up to 300 * 10 seconds = 50 minutes
      delay: 10  # Check every 10 seconds
      loop: "{{ deploy_async_results.results }}"

- name: Propagate run timestamp after node resolution
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Share the controller timestamp with all experiment hosts
      set_fact:
        timestamp: "{{ hostvars['localhost'].timestamp }}"
      delegate_to: "{{ item }}"
      delegate_facts: true
      loop:
        - grid5000
        - node1
        - node2
        - node3

- name: Prepare private Lille cache
  hosts: grid5000
  gather_facts: false
  remote_user: "{{ grid_user }}"
  tasks:
    - name: Skip persistent cache outside Lille Grid5000 runs
      ansible.builtin.meta: end_play
      when: >-
        deployment_mode != 'grid5000' or
        grid_site != grid5000_cache.site or
        not (grid5000_cache.enabled | bool)

    - name: Prepare private Lille cache
      file:
        path: "{{ grid5000_cache.frontend_path }}"
        state: directory
        mode: '0700'

    - name: Prepare controller cache staging directory
      file:
        path: "{{ grid5000_cache.controller_path }}"
        state: directory
        mode: '0700'
      delegate_to: localhost

- name: Bootstrap experiment nodes in parallel
  hosts: node1:node2:node3
  remote_user: root
  strategy: free
  tasks:
    - name: Transfer local RestQ source archive to experiment node
      copy:
        src: "{{ hostvars['localhost'].source_archive_path }}"
        dest: "{{ hostvars['localhost'].source_archive_remote_path }}"
        mode: '0600'
      when: source_mode == 'local_archive'

    - name: Write local source archive checksum manifest
      copy:
        content: >-
          {{ hostvars['localhost'].source_archive_sha256 }}  {{ hostvars['localhost'].source_archive_remote_path }}\n
        dest: "{{ hostvars['localhost'].source_archive_remote_path }}.sha256"
        mode: '0600'
      when: source_mode == 'local_archive'

    - name: Verify local source archive checksum
      command: "sha256sum --check {{ hostvars['localhost'].source_archive_remote_path }}.sha256"
      changed_when: false
      when: source_mode == 'local_archive'

    - name: Remove previous local source directory on experiment node
      file:
        path: "{{ project_directory }}"
        state: absent
      when: source_mode == 'local_archive'

    - name: Create local source directory on experiment node
      file:
        path: "{{ project_directory }}"
        state: directory
        mode: '0755'
      when: source_mode == 'local_archive'

    - name: Materialize local RestQ source archive
      unarchive:
        src: "{{ hostvars['localhost'].source_archive_remote_path }}"
        dest: "{{ project_directory }}"
        remote_src: true
      when: source_mode == 'local_archive'

    - name: Configure the OVH Ubuntu mirror
      replace:
        path: /etc/apt/sources.list
        regexp: 'https?://[^[:space:]]+/ubuntu'
        replace: "{{ ubuntu_apt_mirror }}"
      when: deployment_mode == 'grid5000'

    - name: Refresh apt indexes from the configured mirror
      apt:
        update_cache: true
        cache_valid_time: 3600
      when: deployment_mode == 'grid5000'

    - name: Install shared experiment prerequisites
      apt:
        name:
          - wget
          - ca-certificates
          - apt-transport-https
          - gnupg-agent
          - software-properties-common
          - git
          - docker.io
          - docker-compose
          - maven
          - unzip
        state: present
        install_recommends: false
      when: deployment_mode == 'grid5000'

    - name: Download Java 23 during shared bootstrap
      get_url:
        url: https://download.oracle.com/java/23/archive/jdk-23_linux-x64_bin.deb
        dest: /root/jdk-23_linux-x64_bin.deb
        mode: '0644'
      when: deployment_mode == 'grid5000'

    - name: Install Java 23 during shared bootstrap
      apt:
        deb: /root/jdk-23_linux-x64_bin.deb
      when: deployment_mode == 'grid5000'

    - name: Clone RestQFramework repository during shared bootstrap
      git:
        repo: "{{ github_repo_url }}"
        dest: "{{ project_directory }}"
        recursive: true
        update: no
      when:
        - deployment_mode == 'grid5000'
        - source_mode == 'github'

- name: Setup Node 1 (Database Server)
  hosts: node1
  remote_user: root
  vars:
    postgres_container_name: db-docker-container
    postgres_image: postgres:17
    postgres_password: password
    tpcc_db: "{{ 'tpccdb' if benchmark_type == 'TPCC' else 'tpchdb' }}"
    tpch_db: "{{ 'tpchdb' if benchmark_type == 'TPCH' else 'tpccdb' }}"
    database_name: "{{ tpcc_db if benchmark_type == 'TPCC' else tpch_db }}"
    postgres_port: 5432

  tasks:
    - name: Log experiment configuration
      debug:
        msg: |
          Experiment Configuration:
          - Benchmark Type: {{ benchmark_type }}
          - Database: {{ database_name }}
          - Scale Factor: {{ scale_factor }}{{ ' (warehouses)' if benchmark_type == 'TPCC' else '' }}
          - Duration: {{ experiment_duration }}
          - Timestamp: {{ timestamp }}

    - name: Validate PostgreSQL and Hikari configuration compatibility
      assert:
        that:
          - postgresql_config.max_connections >= hikari_config.maximum_pool_size
        fail_msg: "PostgreSQL max_connections ({{ postgresql_config.max_connections }}) must be >= Hikari maximum_pool_size ({{ hikari_config.maximum_pool_size }})"
        success_msg: "PostgreSQL and Hikari configuration are compatible"

    - name: Download Java 23
      get_url:
        url: https://download.oracle.com/java/23/archive/jdk-23_linux-x64_bin.deb
        dest: /root/jdk-23_linux-x64_bin.deb
      register: java_download

    - name: Log Java download
      debug:
        msg: "Java downloaded: {{ java_download.dest }}"

    - name: Install Java 23
      apt:
        deb: /root/jdk-23_linux-x64_bin.deb
      register: java_install

    - name: Log Java installation
      debug:
        msg: "Java installation completed with status: {{ java_install.changed }}"

    - name: Update apt cache
      apt:
        update_cache: yes

    - name: Run apt-get update
      command: apt-get update
      changed_when: false

    - name: Install wget, ca-certificates, and Docker dependencies
      apt:
        name:
          - wget
          - ca-certificates
          - apt-transport-https
          - gnupg-agent
          - software-properties-common
        state: present

    - name: Update apt cache
      apt:
        update_cache: yes

    - name: Install Docker, Docker Compose, and PostgreSQL client
      apt:
        name:
          - docker.io
          - docker-compose
          - postgresql-client
          - unzip
        state: present

    - name: Ensure Docker service is running
      service:
        name: docker
        state: started
        enabled: true
    
    - name: Clone RestQFramework repository
      git:
        repo: "{{ github_repo_url }}"
        dest: "{{ project_directory }}"
        recursive: yes
        update: no
      when: source_mode == 'github'
      register: git_clone

    - name: Log repository clone
      debug:
        msg: "Repository cloned"

    - name: Set scale factor filename part
      set_fact:
        scale_factor_filename_part: "{{ scale_factor | regex_replace('^(\\d+)(\\.0+)?$', '\\1') | replace('.', '_') }}"

    - name: Set dump filename based on benchmark configuration
      set_fact:
        dump_filename: "{{ benchmark_type | lower }}_sc_f_{{ scale_factor_filename_part }}.zip"

    - name: Log dump configuration
      debug:
        msg: |
          Database population configuration:
          - Source: {{ database_source }}
          - Dump filename: {{ dump_filename }}
          - Dumps directory: {{ dumps_directory }}

    - name: Check cached SQL dump on Lille frontend
      stat:
        path: "{{ grid5000_cache.frontend_path }}/{{ dump_filename }}"
      register: cached_dump_stat
      delegate_to: grid5000
      when: >-
        deployment_mode == 'grid5000' and grid_site == grid5000_cache.site and
        (grid5000_cache.enabled | bool)

    - name: Check cached SQL dump checksum on Lille frontend
      stat:
        path: "{{ grid5000_cache.frontend_path }}/{{ dump_filename }}.sha256"
      register: cached_dump_checksum_stat
      delegate_to: grid5000
      when: cached_dump_stat.stat.exists | default(false)

    - name: Validate cached artifact checksum
      shell: >-
        cd {{ grid5000_cache.frontend_path }} &&
        sha256sum --check {{ dump_filename }}.sha256
      register: cached_dump_checksum
      changed_when: false
      failed_when: false
      delegate_to: grid5000
      when: cached_dump_checksum_stat.stat.exists | default(false)

    - name: Fetch verified SQL dump from private Lille cache
      fetch:
        src: "{{ grid5000_cache.frontend_path }}/{{ dump_filename }}"
        dest: "{{ grid5000_cache.controller_path }}/{{ dump_filename }}"
        flat: true
      delegate_to: grid5000
      when: cached_dump_checksum.rc | default(1) == 0

    - name: Materialize cached SQL dump on database node
      copy:
        src: "{{ grid5000_cache.controller_path }}/{{ dump_filename }}"
        dest: "{{ dumps_directory }}/{{ dump_filename }}"
        mode: '0644'
      when: cached_dump_checksum.rc | default(1) == 0

    - name: Create SQL dumps directory on remote node
      file:
        path: "{{ dumps_directory }}"
        state: directory
        mode: '0755'
      when: database_source == "dumps" or database_source == "huggingface"

    - name: Copy SQL dumps to remote node (when not using localhost)
      copy:
        src: "{{ playbook_dir }}/../../sql_dumps/postgresql/"
        dest: "{{ dumps_directory }}/"
        mode: '0644'
      when: database_source == "dumps" and deployment_mode != "localhost"

    - name: Download SQL dump from Hugging Face
      get_url:
        url: "https://huggingface.co/datasets/{{ huggingface_repo }}/resolve/main/sql_dumps/postgresql/{{ dump_filename }}?download=true"
        dest: "{{ dumps_directory }}/{{ dump_filename }}"
        mode: '0644'
      when: >-
        database_source == "huggingface" and
        cached_dump_checksum.rc | default(1) != 0
      register: hf_download
      retries: 3
      delay: 10

    - name: Log Hugging Face download
      debug:
        msg: "Downloaded {{ dump_filename }} from Hugging Face."
      when: database_source == "huggingface" and hf_download.changed

    - name: Calculate downloaded SQL dump checksum
      command: "sha256sum {{ dumps_directory }}/{{ dump_filename }}"
      register: downloaded_dump_checksum
      changed_when: false
      when: >-
        database_source == 'huggingface' and
        cached_dump_checksum.rc | default(1) != 0 and
        deployment_mode == 'grid5000' and grid_site == grid5000_cache.site and
        (grid5000_cache.enabled | bool)

    - name: Stage SQL dump on controller for private Lille cache
      fetch:
        src: "{{ dumps_directory }}/{{ dump_filename }}"
        dest: "{{ grid5000_cache.controller_path }}/{{ dump_filename }}"
        flat: true
      when: downloaded_dump_checksum is succeeded

    - name: Upload SQL dump cache candidate to Lille frontend
      copy:
        src: "{{ grid5000_cache.controller_path }}/{{ dump_filename }}"
        dest: "{{ grid5000_cache.frontend_path }}/{{ dump_filename }}.partial"
        mode: '0600'
      delegate_to: grid5000
      when: downloaded_dump_checksum is succeeded

    - name: Check staged SQL dump checksum on Lille frontend
      command: "sha256sum {{ grid5000_cache.frontend_path }}/{{ dump_filename }}.partial"
      register: staged_dump_checksum
      changed_when: false
      delegate_to: grid5000
      when: downloaded_dump_checksum is succeeded

    - name: Publish downloaded SQL dump to private Lille cache
      shell: |
        cd {{ grid5000_cache.frontend_path }}
        sha256sum {{ dump_filename }}.partial | sed 's/\.partial$//' > {{ dump_filename }}.sha256.partial
        mv {{ grid5000_cache.frontend_path }}/{{ dump_filename }}.partial {{ grid5000_cache.frontend_path }}/{{ dump_filename }}
        mv {{ grid5000_cache.frontend_path }}/{{ dump_filename }}.sha256.partial {{ grid5000_cache.frontend_path }}/{{ dump_filename }}.sha256
      delegate_to: grid5000
      when: downloaded_dump_checksum is succeeded

    - name: Log SQL dumps copy
      debug:
        msg: "SQL dumps copied to remote node at {{ dumps_directory }}"
      when: database_source == "dumps" and deployment_mode != "localhost"

    # ====================================
    # PostgreSQL Configuration Setup
    # ====================================
    
    - name: Log PostgreSQL configuration
      debug:
        msg: |
          PostgreSQL Configuration Applied:
          - shared_buffers: {{ postgresql_config.shared_buffers }}
          - work_mem: {{ postgresql_config.work_mem }}
          - maintenance_work_mem: {{ postgresql_config.maintenance_work_mem }}
          - max_stack_depth: {{ postgresql_config.max_stack_depth }}
          - max_connections: {{ postgresql_config.max_connections }}

    - name: Update docker-compose.yml with correct database name
      lineinfile:
        path: "{{ project_directory }}/ansible-benchmark/docker-db/docker-compose.yml"
        regexp: '^      POSTGRES_DB:.*'
        line: "      POSTGRES_DB: {{ database_name }}"

    - name: Ensure postgres command flags in docker-compose
      lineinfile:
        path: "{{ project_directory }}/ansible-benchmark/docker-db/docker-compose.yml"
        regexp: '^    command:.*'
        line: "    command: postgres -c shared_buffers={{ postgresql_config.shared_buffers }} -c work_mem={{ postgresql_config.work_mem }} -c maintenance_work_mem={{ postgresql_config.maintenance_work_mem }} -c max_stack_depth={{ postgresql_config.max_stack_depth }} -c max_connections={{ postgresql_config.max_connections }}"
        insertafter: '^      POSTGRES_DB:.*'

    - name: Start PostgreSQL with docker-compose
      shell: |
        cd {{ project_directory }}/ansible-benchmark/docker-db
        docker-compose down -v || true
        POSTGRES_CONTAINER_SHM_SIZE={{ postgresql_config.container_shm_size }} docker-compose up -d --force-recreate --remove-orphans
      register: docker_compose_result
      retries: 3
      delay: 10
      until: docker_compose_result is success
      ignore_errors: true

    - name: Wait for PostgreSQL to be ready
      wait_for:
        host: 127.0.0.1
        port: "{{ postgres_port }}"
        delay: 5
        timeout: 60
        state: started

    - name: Restart PostgreSQL to apply configuration changes
      shell: |
        cd {{ project_directory }}/ansible-benchmark/docker-db
        docker-compose restart postgres
      register: restart_result
      retries: 3
      delay: 10
      until: restart_result is success
      ignore_errors: true

    - name: Wait for PostgreSQL to be ready after restart
      wait_for:
        host: 127.0.0.1
        port: "{{ postgres_port }}"
        delay: 5
        timeout: 60
        state: started

    - name: Log database setup
      debug:
        msg: "PostgreSQL container is running with DB '{{ database_name }}' and user 'admin' with custom configuration"

    - name: Verify PostgreSQL configuration
      shell: |
        docker exec db-docker-container psql -U admin -d {{ database_name }} -c "SHOW shared_buffers;" -At
        docker exec db-docker-container psql -U admin -d {{ database_name }} -c "SHOW work_mem;" -At
        docker exec db-docker-container psql -U admin -d {{ database_name }} -c "SHOW maintenance_work_mem;" -At
        docker exec db-docker-container psql -U admin -d {{ database_name }} -c "SHOW max_stack_depth;" -At
        docker exec db-docker-container psql -U admin -d {{ database_name }} -c "SHOW max_connections;" -At
      register: postgres_config_verify
      ignore_errors: true

    - name: Log PostgreSQL configuration verification
      debug:
        msg: "Config values -> shared_buffers: {{ postgres_config_verify.stdout_lines[0] | default('n/a') }}, work_mem: {{ postgres_config_verify.stdout_lines[1] | default('n/a') }}, maintenance_work_mem: {{ postgres_config_verify.stdout_lines[2] | default('n/a') }}, max_stack_depth: {{ postgres_config_verify.stdout_lines[3] | default('n/a') }}, max_connections: {{ postgres_config_verify.stdout_lines[4] | default('n/a') }}"
      when: postgres_config_verify.rc == 0

    - name: Set installation directory for libraries
      set_fact:
        library_install_dir: "/root/public"

    - name: Check cached Scaphandre binary on Lille frontend
      stat:
        path: "{{ grid5000_cache.frontend_path }}/scaphandre-{{ grid5000_cache.scaphandre_git_ref }}-amd64"
      register: cached_scaphandre_stat
      delegate_to: grid5000
      when: >-
        deployment_mode == 'grid5000' and grid_site == grid5000_cache.site and
        (grid5000_cache.enabled | bool)

    - name: Check cached Scaphandre checksum on Lille frontend
      stat:
        path: "{{ grid5000_cache.frontend_path }}/scaphandre-{{ grid5000_cache.scaphandre_git_ref }}-amd64.sha256"
      register: cached_scaphandre_checksum_stat
      delegate_to: grid5000
      when: cached_scaphandre_stat.stat.exists | default(false)

    - name: Validate cached Scaphandre checksum
      shell: >-
        cd {{ grid5000_cache.frontend_path }} &&
        sha256sum --check scaphandre-{{ grid5000_cache.scaphandre_git_ref }}-amd64.sha256
      register: cached_scaphandre_checksum
      changed_when: false
      failed_when: false
      delegate_to: grid5000
      when: cached_scaphandre_checksum_stat.stat.exists | default(false)

    - name: Fetch verified Scaphandre binary from private Lille cache
      fetch:
        src: "{{ grid5000_cache.frontend_path }}/scaphandre-{{ grid5000_cache.scaphandre_git_ref }}-amd64"
        dest: "{{ grid5000_cache.controller_path }}/scaphandre-{{ grid5000_cache.scaphandre_git_ref }}-amd64"
        flat: true
      delegate_to: grid5000
      when: cached_scaphandre_checksum.rc | default(1) == 0

    - name: Materialize cached Scaphandre binary on database node
      copy:
        src: "{{ grid5000_cache.controller_path }}/scaphandre-{{ grid5000_cache.scaphandre_git_ref }}-amd64"
        dest: /usr/local/bin/scaphandre
        mode: '0755'
      when: cached_scaphandre_checksum.rc | default(1) == 0

    - name: Install Cargo and other dependencies
      apt:
        name:
          - cargo
          - pkg-config
          - libssl-dev
        state: present
        install_recommends: no
      when: cached_scaphandre_checksum.rc | default(1) != 0

    - name: Log installation of Cargo and dependencies
      debug:
        msg: "Cargo and other dependencies installed"

    - name: Download rustup installer
      get_url:
        url: https://sh.rustup.rs
        dest: /root/rustup-init.sh
        mode: "0755"
      when: cached_scaphandre_checksum.rc | default(1) != 0

    - name: Install current stable Rust toolchain
      command: /root/rustup-init.sh -y --profile minimal --default-toolchain stable
      args:
        creates: /root/.cargo/bin/cargo
      when: cached_scaphandre_checksum.rc | default(1) != 0

    - name: Clone Scaphandre repo
      git:
        repo: https://github.com/hubblo-org/scaphandre.git
        dest: "{{ library_install_dir }}/scaphandre"
        version: "{{ grid5000_cache.scaphandre_git_ref }}"
        update: no
      when: cached_scaphandre_checksum.rc | default(1) != 0

    - name: Log Scaphandre repo clone
      debug:
        msg: "Scaphandre repo cloned to {{ library_install_dir }}/scaphandre."

    - name: Build Scaphandre
      shell: |
        cd {{ library_install_dir }}/scaphandre
        /root/.cargo/bin/cargo build --release
      when: cached_scaphandre_checksum.rc | default(1) != 0

    - name: Log Scaphandre build completion
      debug:
        msg: "Scaphandre built successfully."

    - name: Move Scaphandre binary to /usr/local/bin
      command: sudo mv {{ library_install_dir }}/scaphandre/target/release/scaphandre /usr/local/bin/
      when: cached_scaphandre_checksum.rc | default(1) != 0

    - name: Stage Scaphandre binary on controller for private Lille cache
      fetch:
        src: /usr/local/bin/scaphandre
        dest: "{{ grid5000_cache.controller_path }}/scaphandre-{{ grid5000_cache.scaphandre_git_ref }}-amd64"
        flat: true
      when: >-
        cached_scaphandre_checksum.rc | default(1) != 0 and
        deployment_mode == 'grid5000' and grid_site == grid5000_cache.site and
        (grid5000_cache.enabled | bool)

    - name: Upload Scaphandre cache candidate to Lille frontend
      copy:
        src: "{{ grid5000_cache.controller_path }}/scaphandre-{{ grid5000_cache.scaphandre_git_ref }}-amd64"
        dest: "{{ grid5000_cache.frontend_path }}/scaphandre-{{ grid5000_cache.scaphandre_git_ref }}-amd64.partial"
        mode: '0700'
      delegate_to: grid5000
      when: >-
        cached_scaphandre_checksum.rc | default(1) != 0 and
        deployment_mode == 'grid5000' and grid_site == grid5000_cache.site and
        (grid5000_cache.enabled | bool)

    - name: Publish Scaphandre binary to private Lille cache
      shell: |
        cd {{ grid5000_cache.frontend_path }}
        sha256sum scaphandre-{{ grid5000_cache.scaphandre_git_ref }}-amd64.partial | sed 's/\.partial$//' > scaphandre-{{ grid5000_cache.scaphandre_git_ref }}-amd64.sha256.partial
        mv scaphandre-{{ grid5000_cache.scaphandre_git_ref }}-amd64.partial scaphandre-{{ grid5000_cache.scaphandre_git_ref }}-amd64
        mv scaphandre-{{ grid5000_cache.scaphandre_git_ref }}-amd64.sha256.partial scaphandre-{{ grid5000_cache.scaphandre_git_ref }}-amd64.sha256
      delegate_to: grid5000
      when: >-
        cached_scaphandre_checksum.rc | default(1) != 0 and
        deployment_mode == 'grid5000' and grid_site == grid5000_cache.site and
        (grid5000_cache.enabled | bool)

    - name: Log Scaphandre binary move
      debug:
        msg: "Scaphandre binary moved to /usr/local/bin."

    - name: Install Maven
      apt:
        name: maven
        state: present
      register: maven_install

    - name: Initialize Maven wrapper
      shell: mvn -N io.takari:maven:wrapper

    - name: Run setup-formula-config
      shell: |
        cd {{ project_directory }}/ansible-benchmark/powerAPI-intel
        chmod +x setup-formula-config.sh
        set -a  # Export all variables
        source .env
        set +a  # Stop exporting
        ./setup-formula-config.sh
      become: yes
      register: docker_compose_db

    # ====================================
    # Database Population Logic
    # ====================================
    
    - name: Check if dump file exists (when database_source is 'dumps' or 'huggingface')
      stat:
        path: "{{ dumps_directory }}/{{ dump_filename }}"
      register: dump_file_check
      when: database_source == "dumps" or database_source == "huggingface"

    - name: Log dump file availability
      debug:
        msg: "Dump file {{ dump_filename }} exists: {{ dump_file_check.stat.exists | default(false) }}"
      when: database_source == "dumps" or database_source == "huggingface"

    - name: Create temporary directory for dump extraction
      file:
        path: /root/temp_dump_extract
        state: directory
        mode: '0755'
      when: (database_source == "dumps" or database_source == "huggingface") and dump_file_check.stat.exists | default(false)

    - name: Extract dump file
      unarchive:
        src: "{{ dumps_directory }}/{{ dump_filename }}"
        dest: /root/temp_dump_extract
        remote_src: yes
      when: (database_source == "dumps" or database_source == "huggingface") and dump_file_check.stat.exists | default(false)
      register: dump_extract

    - name: Find SQL dump file in extracted directory
      find:
        paths: /root/temp_dump_extract
        patterns: "*.sql"
        recurse: yes
      register: sql_files
      when: (database_source == "dumps" or database_source == "huggingface") and dump_file_check.stat.exists | default(false)

    - name: Load database from dump
      shell: |
        PGPASSWORD={{ postgres_password }} psql -h localhost -p {{ postgres_port }} -U admin -d {{ database_name }} -f {{ sql_files.files[0].path }}
      when: (database_source == "dumps" or database_source == "huggingface") and dump_file_check.stat.exists | default(false) and sql_files.files | length > 0
      register: dump_load_result

    - name: Log successful dump load
      debug:
        msg: "Database successfully populated from dump file: {{ dump_filename }}"
      when: (database_source == "dumps" or database_source == "huggingface") and dump_file_check.stat.exists | default(false) and dump_load_result is defined and dump_load_result.rc == 0

    - name: Clean up temporary dump extraction directory
      file:
        path: /root/temp_dump_extract
        state: absent
      when: (database_source == "dumps" or database_source == "huggingface") and dump_file_check.stat.exists | default(false)

    - name: Set dump_loaded flag
      set_fact:
        dump_loaded: "{{ (database_source == 'dumps' or database_source == 'huggingface') and dump_file_check is defined and dump_file_check.stat.exists | default(false) and dump_load_result is defined and dump_load_result.rc == 0 }}"

    - name: Build and populate from source if dump failed or was not used
      block:
        - name: Build benchbase
          shell: |
            cd {{ project_directory }}/benchbase/
            ./mvnw clean install -P postgres -DskipTests
          register: benchbase_build

        - name: Log benchbase build
          debug:
            msg: "Benchbase build completed with status: {{ benchbase_build.rc }}"

        - name: Build core
          shell: |
            cd {{ project_directory }}/core
            mvn clean install -P executable-jar
          register: core_build

        - name: Log core build
          debug:
            msg: "Core build completed with status: {{ core_build.rc }}"

        - name: Configure database connection properties
          lineinfile:
            path: "{{ project_directory }}/core/src/main/resources/application.properties"
            regexp: '^spring.datasource.url=.*'
            line: "spring.datasource.url=jdbc:postgresql://localhost:{{ postgres_port }}/{{ database_name }}"
            create: yes

        - name: Configure database username
          lineinfile:
            path: "{{ project_directory }}/core/src/main/resources/application.properties"
            regexp: '^spring.datasource.username=.*'
            line: "spring.datasource.username=admin"
            create: yes

        - name: Configure database password
          lineinfile:
            path: "{{ project_directory }}/core/src/main/resources/application.properties"
            regexp: '^spring.datasource.password=.*'
            line: "spring.datasource.password={{ postgres_password }}"
            create: yes

        - name: Configure benchmark type
          lineinfile:
            path: "{{ project_directory }}/core/src/main/resources/application.properties"
            regexp: '^benchmark.type=.*'
            line: "benchmark.type={{ benchmark_type }}"
            create: yes

        - name: Configure scale factor
          lineinfile:
            path: "{{ project_directory }}/core/src/main/resources/application.properties"
            regexp: '^benchmark.scale-factor=.*'
            line: "benchmark.scale-factor={{ scale_factor }}"
            create: yes

        - name: Rebuild core with updated configuration
          shell: |
            cd {{ project_directory }}/core
            mvn clean install -P executable-jar
          register: core_rebuild

        - name: Log core rebuild
          debug:
            msg: "Core rebuild completed with status: {{ core_rebuild.rc }}"

        - name: Run Java application to fulfill the DB with sample data (benchbase fallback)
          shell: |
            cd {{ project_directory }}/core
            java -jar target/core-1.0-SNAPSHOT.jar > /root/core_server.log 2>&1
          register: java_app_start
      when: not (dump_loaded | default(false))

    - name: Log database population method used
      debug:
        msg: |
          Database population completed:
          - Method: {{ 'Pre-made dump (' + dump_filename + ')' if dump_loaded | default(false) else 'Benchbase fulfillment' }}
          - Benchmark Type: {{ benchmark_type }}
          - Scale Factor: {{ scale_factor }}

- name: Setup Node 2 (API Server)
  hosts: node2
  remote_user: root
  vars:
    api_container_name: spring-api
    api_port: 8086
    db_host: "{{ hostvars['node1'].ansible_host }}"
    db_port: 5432
    database_name: "{{ 'tpccdb' if benchmark_type == 'TPCC' else 'tpchdb' }}"
    db_user: admin
    db_password: password
  tasks:
    - name: Download Java 23
      get_url:
        url: https://download.oracle.com/java/23/archive/jdk-23_linux-x64_bin.deb
        dest: /root/jdk-23_linux-x64_bin.deb
      register: java_download

    - name: Install Java 23
      apt:
        deb: /root/jdk-23_linux-x64_bin.deb
      register: java_install

    - name: Install wget and ca-certificates
      apt:
        name: 
          - wget
          - ca-certificates
        state: present

    - name: Update apt cache
      apt:
        update_cache: yes

    - name: Run apt-get update
      command: apt-get update
      changed_when: false

    - name: Set installation directory for libraries
      set_fact:
        library_install_dir: /root/public

    - name: Install podman-docker to {{ library_install_dir }}
      apt:
        name:
          - podman-docker
        state: present
        install_recommends: no
      environment:
        DESTDIR: "{{ library_install_dir }}"

    - name: Log installation of podman-docker
      debug:
        msg: "Podman-docker installed in {{ library_install_dir }}."

    - name: Install docker.io to {{ library_install_dir }}
      apt:
        name:
          - docker.io
        state: present
        install_recommends: no
      environment:
        DESTDIR: "{{ library_install_dir }}"

    - name: Log installation of docker.io
      debug:
        msg: "Docker.io installed in {{ library_install_dir }}."

    - name: Install docker-compose to {{ library_install_dir }}
      apt:
        name:
          - docker-compose
        state: present
        install_recommends: no
      environment:
          DESTDIR: "{{ library_install_dir }}"

    - name: Log installation of docker-compose
      debug:
        msg: "Docker-compose installed in {{ library_install_dir }}."

    - name: Install Cargo and other dependencies to {{ library_install_dir }}
      apt:
        name:
          - cargo
          - pkg-config
          - libssl-dev
        state: present
        install_recommends: no
      environment:
        DESTDIR: "{{ library_install_dir }}"

    - name: Log installation of Cargo and dependencies
      debug:
        msg: "Cargo and other dependencies installed in {{ library_install_dir }}."

    - name: Download rustup installer
      get_url:
        url: https://sh.rustup.rs
        dest: /root/rustup-init.sh
        mode: "0755"

    - name: Install current stable Rust toolchain
      command: /root/rustup-init.sh -y --profile minimal --default-toolchain stable
      args:
        creates: /root/.cargo/bin/cargo

    - name: Clone Scaphandre repo
      git:
        repo: https://github.com/hubblo-org/scaphandre.git
        dest: "{{ library_install_dir }}/scaphandre"
        update: no

    - name: Log Scaphandre repo clone
      debug:
        msg: "Scaphandre repo cloned to {{ library_install_dir }}/scaphandre."

    - name: Build Scaphandre
      shell: |
        cd {{ library_install_dir }}/scaphandre
        /root/.cargo/bin/cargo build --release

    - name: Log Scaphandre build completion
      debug:
        msg: "Scaphandre built successfully."

    - name: Move Scaphandre binary to /usr/local/bin
      command: sudo mv {{ library_install_dir }}/scaphandre/target/release/scaphandre /usr/local/bin/

    - name: Log Scaphandre binary move
      debug:
        msg: "Scaphandre binary moved to /usr/local/bin."

    - name: Install Maven
      apt:
        name: maven
        state: present

    - name: Initialize Maven wrapper
      shell: mvn -N io.takari:maven:wrapper

    - name: Clone RestQFramework repository
      git:
        repo: "{{ github_repo_url }}"
        dest: "{{ project_directory }}"
        recursive: yes
        update: no
      when: source_mode == 'github'

    - name: Run setup-formula-config and start docker compose for power monitoring
      shell: |
        cd {{ project_directory }}/ansible-benchmark/powerAPI-intel
        chmod +x setup-formula-config.sh
        set -a  # Export all variables
        source .env
        set +a  # Stop exporting
        ./setup-formula-config.sh
      become: yes
      register: docker_compose_power

    - name: Build benchbase
      shell: |
        cd {{ project_directory }}/benchbase/
        ./mvnw clean install -P postgres -DskipTests

    - name: Build core
      shell: |
        cd {{ project_directory }}/core
        mvn clean install -P simple-jar

    - name: Modify application properties
      lineinfile:
        path: "{{ project_directory }}/api-http/src/main/resources/application.properties"
        regexp: '^spring.datasource.url=.*'
        line: "spring.datasource.url=jdbc:postgresql://{{ db_host }}:{{ db_port }}/{{ database_name }}"

    - name: Modify Jakarta persistence URL
      lineinfile:
        path: "{{ project_directory }}/api-http/src/main/resources/application.properties"
        regexp: '^jakarta.persistence.jdbc.url=.*'
        line: "jakarta.persistence.jdbc.url=jdbc:postgresql://{{ db_host }}:{{ db_port }}/{{ database_name }}"

    - name: Configure benchmark type in API
      lineinfile:
        path: "{{ project_directory }}/api-http/src/main/resources/application.properties"
        regexp: '^benchmark.type=.*'
        line: "benchmark.type={{ benchmark_type }}"

    - name: Build API HTTP module with benchmark-specific profile
      shell: |
        cd {{ project_directory }}/api-http
        mvn clean install -P {{ 'springboot-tpcc' if benchmark_type == 'TPCC' else 'springboot-tpch' }}

    - name: Create target directory for JAR file
      file:
        path: "{{ project_directory }}/ansible-benchmark/docker-api/target"
        state: directory
        mode: '0755'

    - name: Copy built JAR file to docker-api directory
      copy:
        src: "{{ project_directory }}/api-http/target/api-http-1.0-SNAPSHOT-{{ benchmark_type | lower }}.jar"
        dest: "{{ project_directory }}/ansible-benchmark/docker-api/target/api-http-1.0-SNAPSHOT.jar"
        mode: '0644'
        remote_src: yes

    - name: Update docker-compose.yml with correct environment variables
      lineinfile:
        path: "{{ project_directory }}/ansible-benchmark/docker-api/docker-compose.yml"
        regexp: '^      SPRING_DATASOURCE_URL:.*'
        line: "      SPRING_DATASOURCE_URL: jdbc:postgresql://{{ db_host }}:{{ db_port }}/{{ database_name }}"
      register: update_db_url

    - name: Update docker-compose.yml with database username
      lineinfile:
        path: "{{ project_directory }}/ansible-benchmark/docker-api/docker-compose.yml"
        regexp: '^      SPRING_DATASOURCE_USERNAME:.*'
        line: "      SPRING_DATASOURCE_USERNAME: {{ db_user }}"
      register: update_db_user

    - name: Update docker-compose.yml with database password
      lineinfile:
        path: "{{ project_directory }}/ansible-benchmark/docker-api/docker-compose.yml"
        regexp: '^      SPRING_DATASOURCE_PASSWORD:.*'
        line: "      SPRING_DATASOURCE_PASSWORD: {{ db_password }}"
      register: update_db_password

    - name: Add benchmark type environment variable
      lineinfile:
        path: "{{ project_directory }}/ansible-benchmark/docker-api/docker-compose.yml"
        regexp: '^      BENCHMARK_TYPE:.*'
        line: "      BENCHMARK_TYPE: {{ benchmark_type }}"
        insertafter: "SPRING_DATASOURCE_PASSWORD:"

    # Add Hikari Connection Pool Environment Variables
    - name: Add Hikari auto-commit environment variable
      lineinfile:
        path: "{{ project_directory }}/ansible-benchmark/docker-api/docker-compose.yml"
        regexp: '^      HIKARI_AUTO_COMMIT:.*'
        line: "      HIKARI_AUTO_COMMIT: \"{{ app_environment_vars.HIKARI_AUTO_COMMIT }}\""
        insertafter: "BENCHMARK_TYPE:"

    - name: Add Hikari connection timeout environment variable
      lineinfile:
        path: "{{ project_directory }}/ansible-benchmark/docker-api/docker-compose.yml"
        regexp: '^      HIKARI_CONNECTION_TIMEOUT:.*'
        line: "      HIKARI_CONNECTION_TIMEOUT: \"{{ app_environment_vars.HIKARI_CONNECTION_TIMEOUT }}\""
        insertafter: "HIKARI_AUTO_COMMIT:"

    - name: Add Hikari idle timeout environment variable
      lineinfile:
        path: "{{ project_directory }}/ansible-benchmark/docker-api/docker-compose.yml"
        regexp: '^      HIKARI_IDLE_TIMEOUT:.*'
        line: "      HIKARI_IDLE_TIMEOUT: \"{{ app_environment_vars.HIKARI_IDLE_TIMEOUT }}\""
        insertafter: "HIKARI_CONNECTION_TIMEOUT:"

    - name: Add Hikari keepalive time environment variable
      lineinfile:
        path: "{{ project_directory }}/ansible-benchmark/docker-api/docker-compose.yml"
        regexp: '^      HIKARI_KEEPALIVE_TIME:.*'
        line: "      HIKARI_KEEPALIVE_TIME: \"{{ app_environment_vars.HIKARI_KEEPALIVE_TIME }}\""
        insertafter: "HIKARI_IDLE_TIMEOUT:"

    - name: Add Hikari max lifetime environment variable
      lineinfile:
        path: "{{ project_directory }}/ansible-benchmark/docker-api/docker-compose.yml"
        regexp: '^      HIKARI_MAX_LIFETIME:.*'
        line: "      HIKARI_MAX_LIFETIME: \"{{ app_environment_vars.HIKARI_MAX_LIFETIME }}\""
        insertafter: "HIKARI_KEEPALIVE_TIME:"

    - name: Add Hikari maximum pool size environment variable
      lineinfile:
        path: "{{ project_directory }}/ansible-benchmark/docker-api/docker-compose.yml"
        regexp: '^      HIKARI_MAXIMUM_POOL_SIZE:.*'
        line: "      HIKARI_MAXIMUM_POOL_SIZE: \"{{ app_environment_vars.HIKARI_MAXIMUM_POOL_SIZE }}\""
        insertafter: "HIKARI_MAX_LIFETIME:"

    - name: Add Hikari minimum idle environment variable
      lineinfile:
        path: "{{ project_directory }}/ansible-benchmark/docker-api/docker-compose.yml"
        regexp: '^      HIKARI_MINIMUM_IDLE:.*'
        line: "      HIKARI_MINIMUM_IDLE: \"{{ app_environment_vars.HIKARI_MINIMUM_IDLE }}\""
        insertafter: "HIKARI_MAXIMUM_POOL_SIZE:"

    - name: Add Hikari initialization fail timeout environment variable
      lineinfile:
        path: "{{ project_directory }}/ansible-benchmark/docker-api/docker-compose.yml"
        regexp: '^      HIKARI_INITIALIZATION_FAIL_TIMEOUT:.*'
        line: "      HIKARI_INITIALIZATION_FAIL_TIMEOUT: \"{{ app_environment_vars.HIKARI_INITIALIZATION_FAIL_TIMEOUT }}\""
        insertafter: "HIKARI_MINIMUM_IDLE:"

    - name: Add Hikari isolate internal queries environment variable
      lineinfile:
        path: "{{ project_directory }}/ansible-benchmark/docker-api/docker-compose.yml"
        regexp: '^      HIKARI_ISOLATE_INTERNAL_QUERIES:.*'
        line: "      HIKARI_ISOLATE_INTERNAL_QUERIES: \"{{ app_environment_vars.HIKARI_ISOLATE_INTERNAL_QUERIES }}\""
        insertafter: "HIKARI_INITIALIZATION_FAIL_TIMEOUT:"

    - name: Add Hikari allow pool suspension environment variable
      lineinfile:
        path: "{{ project_directory }}/ansible-benchmark/docker-api/docker-compose.yml"
        regexp: '^      HIKARI_ALLOW_POOL_SUSPENSION:.*'
        line: "      HIKARI_ALLOW_POOL_SUSPENSION: \"{{ app_environment_vars.HIKARI_ALLOW_POOL_SUSPENSION }}\""
        insertafter: "HIKARI_ISOLATE_INTERNAL_QUERIES:"

    - name: Add Hikari read only environment variable
      lineinfile:
        path: "{{ project_directory }}/ansible-benchmark/docker-api/docker-compose.yml"
        regexp: '^      HIKARI_READ_ONLY:.*'
        line: "      HIKARI_READ_ONLY: \"{{ app_environment_vars.HIKARI_READ_ONLY }}\""
        insertafter: "HIKARI_ALLOW_POOL_SUSPENSION:"

    - name: Add Hikari register mbeans environment variable
      lineinfile:
        path: "{{ project_directory }}/ansible-benchmark/docker-api/docker-compose.yml"
        regexp: '^      HIKARI_REGISTER_MBEANS:.*'
        line: "      HIKARI_REGISTER_MBEANS: \"{{ app_environment_vars.HIKARI_REGISTER_MBEANS }}\""
        insertafter: "HIKARI_READ_ONLY:"

    - name: Add Hikari validation timeout environment variable
      lineinfile:
        path: "{{ project_directory }}/ansible-benchmark/docker-api/docker-compose.yml"
        regexp: '^      HIKARI_VALIDATION_TIMEOUT:.*'
        line: "      HIKARI_VALIDATION_TIMEOUT: \"{{ app_environment_vars.HIKARI_VALIDATION_TIMEOUT }}\""
        insertafter: "HIKARI_REGISTER_MBEANS:"

    - name: Wait for database to be reachable from API server
      wait_for:
        host: "{{ db_host }}"
        port: "{{ db_port }}"
        timeout: 300
        state: started

    - name: Start API server container
      shell: |
        cd {{ project_directory }}/ansible-benchmark/docker-api
        docker-compose up -d
      register: docker_compose_result
      retries: 3
      delay: 10
      until: docker_compose_result is success
      ignore_errors: true

    - name: Wait for API server to be ready
      wait_for:
        host: 127.0.0.1
        port: "{{ api_port }}"
        delay: 5
        timeout: 60
        state: started

    - name: Log API server container start
      debug:
        msg: "API server container is running on port {{ api_port }} with {{ benchmark_type }} benchmark"

- name: Setup Node 3 (Benchmark Client)
  hosts: node3
  remote_user: root
  vars:
    api_port: 8086
  tasks:
    - name: Download Java 23
      get_url:
        url: https://download.oracle.com/java/23/archive/jdk-23_linux-x64_bin.deb
        dest: /root/jdk-23_linux-x64_bin.deb
      register: java_download

    - name: Install Java 23
      apt:
        deb: /root/jdk-23_linux-x64_bin.deb
      register: java_install

    - name: Install wget and ca-certificates
      apt:
        name: 
          - wget
          - ca-certificates
        state: present

    - name: Update apt cache
      apt:
        update_cache: yes

    - name: Install Maven
      apt:
        name: maven
        state: present

    - name: Initialize Maven wrapper
      shell: mvn -N io.takari:maven:wrapper

    - name: Clone RestQFramework repository
      git:
        repo: "{{ github_repo_url }}"
        dest: "{{ project_directory }}"
        recursive: yes
        update: no
      when: source_mode == 'github'

    - name: Build benchbase
      shell: |
        cd {{ project_directory }}/benchbase/
        ./mvnw clean install -P postgres -DskipTests

    - name: Build core
      shell: |
        cd {{ project_directory }}/core
        mvn clean install -P simple-jar

    - name: Copy custom benchmark-config.xml (local) to the server
      copy:
        src: "../benchmark-config/{{ benchmark_config_file }}"
        dest: "{{ project_directory }}/api-http/src/main/resources/benchmark-config.xml"

    - name: Copy labelled benchmark parameters (local) to the server
      copy:
        src: "../benchmark-config/{{ benchmark_parameters_file }}"
        dest: "{{ project_directory }}/api-http/src/main/resources/parameters.xml"

    - name: Build Benchmark module
      shell: |
        cd {{ project_directory }}/api-http
        mvn clean install -P benchmark-app

    - name: Verify API health from benchmark client
      uri:
        url: "http://{{ hostvars['node2'].ansible_host }}:{{ api_port }}/api/health"
        method: GET
        status_code: 200
        return_content: true
        timeout: 5
      register: api_health
      changed_when: false
      until: >-
        (api_health.status | default(0) | int) == 200 and
        (api_health.json | default({})).get('status', '') == 'UP' and
        (api_health.json | default({})).get('benchmark', '') == benchmark_type
      retries: 12
      delay: 5

    - name: Start Scaphandre measurement for workload
      shell: >-
        nohup scaphandre json -t {{ scaphandre_timeout_s }}
        -s {{ scaphandre_timestep_s }} --containers
        -f /root/experiments_summary_{{ item.measurement_role }}.json
        >/root/scaphandre_{{ item.measurement_role }}.log 2>&1 &
      delegate_to: "{{ item.host }}"
      loop:
        - host: node1
          measurement_role: dbserver
        - host: node2
          measurement_role: apiserver
      loop_control:
        label: "{{ item.measurement_role }}"

    - name: Create results directory on controller before workload
      file:
        path: "~/Desktop/Results_rest_q_xml_benchmarks/experiment_{{ benchmark_type }}_{{ timestamp }}"
        state: directory
        mode: '0755'
      delegate_to: localhost

    - name: Run benchmark
      shell: |
        cd {{ project_directory }}/api-http
        java -jar target/api-http-1.0-SNAPSHOT-jar-with-dependencies.jar > /root/benchmark_client.log 2>&1
      environment:
        BENCHMARK_CONFIG: "{{ project_directory }}/api-http/src/main/resources/benchmark-config.xml"
        BENCHMARK_PARAMETERS: "{{ project_directory }}/api-http/src/main/resources/parameters.xml"
        BENCHMARK_BASE_URL: "http://{{ hostvars['node2'].ansible_host }}:{{ api_port }}/api/reports"
        BENCHMARK_TYPE: "{{ benchmark_type }}"
      register: benchmark_run
      failed_when: false

    - name: Preserve benchmark process return code for final verdict
      set_fact:
        benchmark_run_rc: "{{ benchmark_run.rc | default(1) | int }}"
          
- name: Stopping Scaphandre measurement on Node 1
  hosts: node1
  remote_user: root
  tasks:
    - name: Stop Scaphandre measurement on Node 1
      shell: |
        pkill -f "scaphandre json -t {{ scaphandre_timeout_s }} -s {{ scaphandre_timestep_s }}"
      ignore_errors: true

    - name: Log Scaphandre stop on Node 1
      debug:
        msg: "Scaphandre measurement stopped on DB server."

- name: Stopping Scaphandre measurement on Node 2
  hosts: node2
  remote_user: root
  tasks:
    - name: Stop Scaphandre measurement on Node 2
      shell: |
        pkill -f "scaphandre json -t {{ scaphandre_timeout_s }} -s {{ scaphandre_timestep_s }}"
      ignore_errors: true

    - name: Log Scaphandre stop on Node 2
      debug:
        msg: "Scaphandre measurement stopped on API server."

- name: Ensure controller result directory exists before collection
  hosts: localhost
  gather_facts: false
  run_once: true
  tasks:
    - name: Create controller result directory
      file:
        path: "~/Desktop/Results_rest_q_xml_benchmarks/experiment_{{ benchmark_type }}_{{ timestamp }}"
        state: directory
        mode: '0755'

- name: Fetch results from Node 1
  hosts: node1
  remote_user: root
  tasks:
    - name: Fetch results to controller
      fetch:
        src: /root/experiments_summary_dbserver.json
        dest: /tmp/experiments_summary_dbserver.json
        flat: yes
      register: db_energy_fetch
      ignore_errors: true

- name: Fetch results from Node 2
  hosts: node2
  remote_user: root
  tasks:
    - name: Fetch results to controller
      fetch:
        src: /root/experiments_summary_apiserver.json
        dest: /tmp/experiments_summary_apiserver.json
        flat: yes
      register: api_energy_fetch
      ignore_errors: true

    - name: Create results directory on controller
      local_action:
        module: file
        path: "~/Desktop/Results_rest_q_xml_benchmarks/experiment_{{ benchmark_type }}_{{ timestamp }}"
        state: directory
        mode: '0755'
      run_once: true
      
- name: Install MongoDB tools on Node1
  hosts: node1
