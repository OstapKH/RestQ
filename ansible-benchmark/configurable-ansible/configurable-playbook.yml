- name: Dump MongoDB db_power on DB server (Node1) and fetch dump
  hosts: node1
  remote_user: root
  tasks:
    - name: Dump MongoDB db_power on DB server
      shell: docker exec mongodb mongoexport --db db_power --collection power_reports --out /root/mongodump-DB-server.json --jsonArray
      register: mongodump_db
    
    - name: Download JSON file from docker container to node 
      shell: docker cp mongodb:/root/mongodump-DB-server.json /root/mongodump-DB-server.json

    - name: Validate MongoDB export from DB server
      shell: "jq -e 'type == \"array\" and length > 0' /root/mongodump-DB-server.json"
      register: mongodump_db_validation
      changed_when: false
      failed_when: false

    - name: Fetch MongoDB dump from DB server to controller
      fetch:
        src: /root/mongodump-DB-server.json
        dest: "~/Desktop/Results_rest_q_xml_benchmarks/experiment_{{ benchmark_type }}_{{ timestamp }}/mongodump-DB-server.json"
        flat: yes
      when: mongodump_db_validation.rc == 0

    - name: Log DB server dump download
      debug:
        msg: "MongoDB dump from DB server downloaded to ~/Desktop/Results_rest_q_xml_benchmarks/experiment_{{ benchmark_type }}_{{ timestamp }}/mongodump-DB-server.json"

- name: Dump MongoDB db_power on API server (Node2) and fetch dump
  hosts: node2
  remote_user: root
  tasks:
    - name: Dump MongoDB db_power on API server
      shell: docker exec mongodb mongoexport --db db_power --collection power_reports --out /root/mongodump-API-server.json --jsonArray
      register: mongodump_api

    - name: Download JSON file from docker container to node 
      shell: docker cp mongodb:/root/mongodump-API-server.json /root/mongodump-API-server.json

    - name: Validate MongoDB export from API server
      shell: "jq -e 'type == \"array\" and length > 0' /root/mongodump-API-server.json"
      register: mongodump_api_validation
      changed_when: false
      failed_when: false

    - name: Fetch MongoDB dump from API server to controller
      fetch:
        src: /root/mongodump-API-server.json
        dest: "~/Desktop/Results_rest_q_xml_benchmarks/experiment_{{ benchmark_type }}_{{ timestamp }}/mongodump-API-server.json"
        flat: yes
      when: mongodump_api_validation.rc == 0

    - name: Log API server dump download
      debug:
        msg: "MongoDB dump from API server downloaded to ~/Desktop/Results_rest_q_xml_benchmarks/experiment_{{ benchmark_type }}_{{ timestamp }}/mongodump-API-server.json"

- name: Fetch API Server Application Logs
  hosts: node2
  remote_user: root
  tasks:
    - name: Get logs from API server container
      shell: docker logs spring-api > /root/api_server_app.log 2>&1
      register: docker_logs_api
      ignore_errors: true
      
    - name: Fetch API server application logs
      fetch:
        src: /root/api_server_app.log
        dest: "~/Desktop/Results_rest_q_xml_benchmarks/experiment_{{ benchmark_type }}_{{ timestamp }}/api_server_app.log"
        flat: yes
        
    - name: Log API server app log download
      debug:
        msg: "API server application logs downloaded to ~/Desktop/Results_rest_q_xml_benchmarks/experiment_{{ benchmark_type }}_{{ timestamp }}/api_server_app.log"

- name: Fetch log files from Node 3 (Benchmark client)
  hosts: node3
  remote_user: root
  tasks:
    - name: Fetch benchmark client logs
      fetch:
        src: /root/benchmark_client.log
        dest: "~/Desktop/Results_rest_q_xml_benchmarks/experiment_{{ benchmark_type }}_{{ timestamp }}/benchmark_client.log"
        flat: yes
      register: benchmark_log_fetch
      ignore_errors: true

    - name: Log benchmark client log download
      debug:
        msg: "Benchmark client logs downloaded to your local machine at ~/Desktop/Results_rest_q_xml_benchmarks/experiment_{{ benchmark_type }}_{{ timestamp }}/benchmark_client.log"
    
    - name: Fetch system logs
      fetch:
        src: /var/log/syslog
        dest: "~/Desktop/Results_rest_q_xml_benchmarks/experiment_{{ benchmark_type }}_{{ timestamp }}/node3_syslog.log"
        flat: yes
      ignore_errors: true

- name: Get DB Container ID from Node 1
  hosts: node1
  remote_user: root
  tasks:
    - name: Get DB container ID
      shell: docker ps -q -f name=db-docker-container
      register: db_container_id_result
      changed_when: false
      failed_when: false # Don't fail if container not found

    - name: Store DB Container ID as fact
      set_fact:
        db_container_id_fact: "{{ db_container_id_result.stdout }}"
        cacheable: yes

- name: Get API Container ID from Node 2
  hosts: node2
  remote_user: root
  tasks:
    - name: Get API container ID
      shell: docker ps -q -f name=spring-api
      register: api_container_id_result
      changed_when: false
      failed_when: false # Don't fail if container not found

    - name: Store API Container ID as fact
      set_fact:
        api_container_id_fact: "{{ api_container_id_result.stdout }}"
        cacheable: yes

- name: Aggregate Results and Fetch Files from Node 3
  hosts: node3
  remote_user: root
  tasks:
    - name: Create directory for fixed JSON files
      file:
        path: /root/fixed_json_files
        state: directory
        mode: '0755'

    - name: Copy DB server results from controller to Node 3
      copy:
        src: /tmp/experiments_summary_dbserver.json
        dest: /root/fixed_json_files/experiments_summary_dbserver.json
      register: db_energy_copy
      ignore_errors: true
      when: not (hostvars['node1'].db_energy_fetch.failed | default(true) | bool)

    - name: Copy API server results from controller to Node 3
      copy:
        src: /tmp/experiments_summary_apiserver.json
        dest: /root/fixed_json_files/experiments_summary_apiserver.json
      register: api_energy_copy
      ignore_errors: true
      when: not (hostvars['node2'].api_energy_fetch.failed | default(true) | bool)

    - name: Find benchmark results files
      find:
        paths: "{{ project_directory }}/api-http"
        patterns: "benchmark_results_*.json"
        recurse: yes
      register: benchmark_files
      failed_when: false

    - name: Copy benchmark results to fixed json directory
      copy:
        src: "{{ item.path }}"
        dest: /root/fixed_json_files/
        remote_src: yes
      with_items: "{{ benchmark_files.files | default([]) }}"
      failed_when: false

    - name: Record missing partial diagnostic artifacts
      set_fact:
        diagnostic_missing_artifacts: >-
          {{
            (['db_scaphandre'] if ((hostvars['node1'].db_energy_fetch.failed | default(true) | bool)
              or (db_energy_copy.failed | default(true) | bool)) else [])
            + (['api_scaphandre'] if ((hostvars['node2'].api_energy_fetch.failed | default(true) | bool)
              or (api_energy_copy.failed | default(true) | bool)) else [])
            + (['benchmark_results'] if (benchmark_files.matched | default(0) | int) == 0 else [])
            + (['benchmark_client_log'] if (benchmark_log_fetch.failed | default(true) | bool) else [])
          }}

    - name: Create diagnostic manifest JSON
      copy:
        content: |
          {
            "benchmark_run_rc": {{ benchmark_run_rc | default(1) | int }},
            "missing_artifacts": {{ diagnostic_missing_artifacts | to_json }}
          }
        dest: /root/fixed_json_files/diagnostic_manifest.json
        mode: '0644'

    - name: Create experiment info JSON
      copy:
        content: |
          {
            "benchmark_type": "{{ benchmark_type }}",
            "scale_factor": "{{ scale_factor }}",
            "experiment_duration": "{{ experiment_duration }}",
            "timestamp": "{{ timestamp }}",
            "source_mode": "{{ source_mode }}",
            "github_repo_url": "{{ github_repo_url if source_mode == 'github' else '' }}",
            "source_archive_filename": "{{ hostvars['localhost'].source_archive_filename | default('') }}",
            "source_archive_sha256": "{{ hostvars['localhost'].source_archive_sha256 | default('') }}",
            "node1_hostname": "{{ hostvars['node1'].ansible_host }}",
            "node2_hostname": "{{ hostvars['node2'].ansible_host }}",
            "node3_hostname": "{{ hostvars['node3'].ansible_host }}",
            "node3_processor": {{ ansible_processor | default([]) | to_json }},
            "node3_processor_vcpus": {{ ansible_processor_vcpus | default(0) | int }},
            "schedule": "{{ 'TPC-H SF1 Q01/Q06 smoke' if benchmark_config_file == 'benchmark-config-smoke.xml' else 'TPC-H SF1 isolated query study' }}",
            "random_seed": 5000,
            "query_count": {{ 2 if benchmark_config_file == 'benchmark-config-smoke.xml' else 19 }},
            "measured_run_count": {{ 2 if benchmark_config_file == 'benchmark-config-smoke.xml' else 57 }},
            "db_container_id": "{{ hostvars['node1'].db_container_id_fact | default('') }}",
            "api_container_id": "{{ hostvars['node2'].api_container_id_fact | default('') }}"
          }
        dest: /root/fixed_json_files/experiment_info.json
        mode: '0644'

    - name: Create results directory on controller
      local_action:
        module: file
        path: "~/Desktop/Results_rest_q_xml_benchmarks/experiment_{{ benchmark_type }}_{{ timestamp }}"
        state: directory
        mode: '0755'
      run_once: true

    - name: Fetch experiment info file
      fetch:
        src: /root/fixed_json_files/experiment_info.json
        dest: "~/Desktop/Results_rest_q_xml_benchmarks/experiment_{{ benchmark_type }}_{{ timestamp }}/experiment_info.json"
        flat: yes
      failed_when: false

    - name: Fetch diagnostic manifest
      fetch:
        src: /root/fixed_json_files/diagnostic_manifest.json
        dest: "~/Desktop/Results_rest_q_xml_benchmarks/experiment_{{ benchmark_type }}_{{ timestamp }}/diagnostic_manifest.json"
        flat: yes
      failed_when: false
        
    - name: Build and run JSON combiner
      shell: |
        cd {{ project_directory }}/api-http
        java -cp target/api-http-1.0-SNAPSHOT-jar-with-dependencies.jar com.restq.utils.JsonCombiner /root/fixed_json_files /root/combined_results_{{ benchmark_type }}_{{ timestamp }}.json {{ energy_validation_boundary_tolerance_ms }}
      register: combiner_output
      failed_when: false
      
    - name: Log combiner output
      debug:
        msg:
          stdout: "{{ combiner_output.stdout_lines | default([]) }}"
          stderr: "{{ combiner_output.stderr_lines | default([]) }}"
          rc: "{{ combiner_output.rc | default(1) }}"

    - name: Check whether combined results were produced
      stat:
        path: /root/combined_results_{{ benchmark_type }}_{{ timestamp }}.json
      register: combined_result_stat

    - name: Read combined validation verdict
      slurp:
        src: /root/combined_results_{{ benchmark_type }}_{{ timestamp }}.json
      register: combined_result_content
      ignore_errors: true
      when: combined_result_stat.stat.exists

    - name: Default combined validation verdict to failed
      set_fact:
        combined_validation_passed: false

    - name: Parse combined validation verdict
      set_fact:
        combined_validation_passed: >-
          {{
            ((combined_result_content.content | b64decode | from_json).validation.valid
              | default(false)) | bool
          }}
      when:
        - combined_result_stat.stat.exists
        - combined_result_content is succeeded
        
    - name: Fetch combined results file
      fetch:
        src: /root/combined_results_{{ benchmark_type }}_{{ timestamp }}.json
        dest: "~/Desktop/Results_rest_q_xml_benchmarks/experiment_{{ benchmark_type }}_{{ timestamp }}/combined_results.json"
        flat: yes
      register: combined_results_fetch
      ignore_errors: true
      when: combined_result_stat.stat.exists
        
    - name: Log results download
      debug:
        msg: "Combined {{ benchmark_type }} benchmark results downloaded to your local machine at ~/Desktop/Results_rest_q_xml_benchmarks/experiment_{{ benchmark_type }}_{{ timestamp }}/combined_results.json" 

    - name: Mark Grid5000 experiment as successfully completed
      set_fact:
        benchmark_completed_successfully: true
      delegate_to: grid5000
      delegate_facts: true
      when:
        - deployment_mode == 'grid5000'
        - benchmark_run_rc | int == 0
        - combined_validation_passed | bool
        - combined_results_fetch is succeeded

    - name: Fail after diagnostic collection when the final verdict is invalid
      ansible.builtin.fail:
        msg: >-
          Benchmark was preserved for diagnosis: client rc={{ benchmark_run_rc | default(1) }},
          combiner rc={{ combiner_output.rc | default(1) }},
          combined validation={{ combined_validation_passed | default(false) }},
          missing={{ diagnostic_missing_artifacts | default([]) }}.
      when: >-
        (benchmark_run_rc | int != 0)
        or not (combined_validation_passed | bool)
        or (combined_results_fetch is not succeeded)

- name: Release Grid5000 reservations after successful completion
  hosts: grid5000
  gather_facts: false
  remote_user: "{{ grid_user }}"
  tasks:
    - name: Skip reservation cleanup outside Grid5000 mode
      ansible.builtin.meta: end_play
      when: deployment_mode != 'grid5000'

    - name: Preserve reservations when the experiment did not complete successfully
      ansible.builtin.meta: end_play
      when: not (benchmark_completed_successfully | default(false) | bool)

    - name: Release Lille reservations
      command: "oardel {{ chifflot_job_id }} {{ other_job_id }}"
      register: lille_cleanup_result
      when: grid_site == 'lille'

    - name: Release non-Lille reservation
      command: "oardel {{ random_job_id }}"
      register: random_cleanup_result
      when: grid_site != 'lille'

    - name: Report released Grid5000 reservations
      debug:
        msg: >-
          Released Grid5000 job(s):
          {{ (chifflot_job_id ~ ', ' ~ other_job_id) if grid_site == 'lille' else random_job_id }}
